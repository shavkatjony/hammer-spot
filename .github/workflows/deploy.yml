# Build, check and deploy the site to GitHub Pages.
# - Every push and pull request: type-check, build, dependency audit.
# - Pushes to main: also deploy to GitHub Pages.
# Actions are pinned to full commit SHAs (supply-chain hardening); the comment shows the tag.
name: Site

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install (locked)
        run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

      - name: Dependency audit (fail on high/critical)
        run: npm audit --audit-level=high

      - name: Configure Pages (base URL and path)
        id: pages
        # only where we deploy; other branches build with the defaults (https://shavkatjony.github.io, base "/")
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Type check
        run: npx astro check

      - name: Build
        run: npm run build
        env:
          # user site (repo shavkatjony.github.io): origin=https://shavkatjony.github.io, base_path=""
          # project site (repo personalweb):        base_path="/personalweb"
          SITE_URL: ${{ steps.pages.outputs.origin || 'https://shavkatjony.github.io' }}
          SITE_BASE: ${{ steps.pages.outputs.base_path }}/

      - name: Upload artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
